# MauiDev.Cli (maui-dev) PackAsTool + VS Code / Cursor extension.
# Version alignment covers the packable CLI and extension/vscode/package.json.
# Pack emits the PackAsTool nupkg only (no snupkg). Linux is enough (net10.0).
# Publish pushes the nupkg to nuget.org and GitHub Packages.
# Extension: vsce package always; Marketplace / Open VSX when secrets exist.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Unused. CI publishes after key, version, test, and pack checks succeed
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  version-align:
    name: Version alignment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout package repo
        uses: actions/checkout@v4

      - name: Fetch hub CI scripts
        uses: actions/checkout@v4
        with:
          repository: nuvyntralabs/MauiEssentials
          ref: main
          path: .ci-tools

      - name: Require matching packable package versions
        id: check
        run: |
          set -euo pipefail
          script=".github/scripts/check-versions.py"
          if [ ! -f "$script" ]; then
            script=".ci-tools/.github/scripts/check-versions.py"
          fi
          python3 "$script" --plugin-root .
          python3 .github/scripts/check-extension-version.py .

  version-check:
    name: NuGet release
    needs: [version-align]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout package repo
        uses: actions/checkout@v4

      - name: Fetch hub CI scripts
        uses: actions/checkout@v4
        with:
          repository: nuvyntralabs/MauiEssentials
          ref: main
          path: .ci-tools

      - name: Check NUGET_KEY and published version
        env:
          NUGET_KEY: ${{ secrets.NUGET_KEY }}
        run: |
          set -euo pipefail
          script=".github/scripts/check-nuget-release.py"
          if [ ! -f "$script" ]; then
            script=".ci-tools/.github/scripts/check-nuget-release.py"
          fi
          python3 "$script" --plugin-root .

  test:
    name: Unit tests
    needs: [version-check]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test
        run: dotnet test MauiDev.sln --configuration Release --nologo

  pack:
    name: Pack MauiDev.Cli
    needs: [test]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p artifacts/nuget
          dotnet pack src/MauiDev.Cli/MauiDev.Cli.csproj --configuration Release --output artifacts/nuget --nologo
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-MauiDev-Linux
          path: artifacts/nuget/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: nuget.org and GitHub Packages
    needs: [pack]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nuvyntralabs/MauiEssentials
          ref: main
          path: .ci-tools
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: nuget-MauiDev-Linux
          path: packages
      - name: Push nupkg
        env:
          NUGET_KEY: ${{ secrets.NUGET_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          script=".github/scripts/push-nuget-packages.py"
          if [ ! -f "$script" ]; then
            script=".ci-tools/.github/scripts/push-nuget-packages.py"
          fi
          python3 "$script" --packages-dir packages

  extension:
    name: VS Code extension
    needs: [test]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/vscode/package-lock.json
      - name: Compile and package
        working-directory: extension/vscode
        run: |
          set -euo pipefail
          npm ci
          npx --yes @vscode/vsce package --allow-missing-repository
          mkdir -p ../../artifacts/vsix
          mv *.vsix ../../artifacts/vsix/
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-MauiDev
          path: artifacts/vsix/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish Marketplace and Open VSX
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          vsix="$(ls artifacts/vsix/*.vsix | head -n 1)"
          if [ -z "${VSCE_PAT:-}" ] || [ -z "${OVSX_PAT:-}" ]; then
            echo "::warning::VSCE_PAT or OVSX_PAT missing. VSIX was packaged; Marketplace/Open VSX publish skipped."
            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              echo "Add VSCE_PAT and OVSX_PAT to publish the extension from main."
            fi
            exit 0
          fi
          npx --yes @vscode/vsce publish --packagePath "$vsix"
          npx --yes ovsx publish "$vsix" --pat "$OVSX_PAT"
